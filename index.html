<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Sistem Pernapasan - IPAS Kelas 6</title>
<style>
:root{--bg:#eef7ff;--card:#fff;--tx:#17324d;--pr:#1e88e5;--ok:#2e9e5b;--no:#d9473f;--mu:#5a7189;--bd:#cfe2f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2b;--card:#182a3d;--tx:#e8f1fa;--pr:#4aa3f0;--ok:#4cc27f;--no:#f06a62;--mu:#9bb2c8;--bd:#2c4560}}
:root[data-theme="dark"]{--bg:#0f1c2b;--card:#182a3d;--tx:#e8f1fa;--pr:#4aa3f0;--ok:#4cc27f;--no:#f06a62;--mu:#9bb2c8;--bd:#2c4560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:clamp(16px,2vw,22px);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:clamp(18px,3vw,32px);margin-bottom:16px}
h1{font-size:clamp(26px,4.5vw,44px);margin:0 0 6px;line-height:1.2}
h2{font-size:clamp(20px,3vw,30px);margin:0 0 12px;line-height:1.3}
.mu{color:var(--mu)}
.hero{text-align:center}.lung{font-size:64px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;background:var(--pr);color:#fff}
button.sec{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin:10px 0;padding:14px 18px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.top{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:8px}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--bg);border-left:6px solid var(--pr)}
.err{color:var(--no);font-weight:700;min-height:1.4em}
table{width:100%;border-collapse:collapse;font-size:.85em}
td,th{border:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top}
.sc{font-size:clamp(44px,8vw,80px);font-weight:800;color:var(--pr);text-align:center;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hide{display:none}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}
@media print{body{background:#fff;color:#000}.row,.noprint{display:none!important}.card{border:1px solid #999}:root{--card:#fff;--tx:#000;--mu:#444;--bd:#999}}
</style></head><body><div class="wrap">

<div id="s1" class="card hero">
<div class="lung">🫁</div>
<h1>Petualangan Sistem Pernapasan</h1>
<p class="mu">IPAS Kelas 6 • SDN Tayur</p>
<div style="text-align:left;max-width:520px;margin:auto">
<label for="nm">Nama Lengkap</label><input id="nm" placeholder="Tulis namamu" autocomplete="off">
<label for="kl">Kelas</label><input id="kl" value="6" placeholder="Contoh: 6A">
<p class="err" id="er"></p>
</div>
<button onclick="mulai()">Mulai Kuis ▶</button>
<p class="mu">10 soal • Jawab dengan teliti ya!</p>
</div>

<div id="s2" class="card hide">
<div class="top"><span id="no"></span><span id="pt"></span></div>
<div class="bar"><i id="pb"></i></div>
<h2 id="q"></h2><div id="op"></div>
<div id="fb" class="fb hide"></div>
<div class="row"><button id="nx" class="hide" onclick="lanjut()">Lanjut ➜</button></div>
</div>

<div id="s3" class="hide">
<div class="card">
<h1>📋 Laporan Hasil Tugas</h1>
<p class="mu">IPAS • Sistem Pernapasan Manusia • SDN Tayur</p>
<p><b>Nama:</b> <span id="rn"></span><br><b>Kelas:</b> <span id="rk"></span><br><b>Tanggal:</b> <span id="rt"></span></p>
<div class="sc" id="rs"></div>
<p style="text-align:center;font-weight:700" id="rp"></p>
<p style="text-align:center" class="mu" id="rb"></p>
</div>
<div class="card"><h2>Rincian Jawaban</h2>
<div style="overflow-x:auto"><table><thead><tr><th>No</th><th>Soal</th><th>Jawabanmu</th><th>Hasil</th></tr></thead><tbody id="rd"></tbody></table></div>
<div class="row noprint">
<button onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
<button class="sec" onclick="salin()">📎 Salin Laporan</button>
<button class="sec" onclick="location.reload()">🔄 Main Lagi</button>
</div><p id="cp" class="mu noprint"></p>
</div></div>

</div>
<script>
var Q=[
["Apa organ utama pada sistem pernapasan manusia?","Paru-paru",["Jantung","Lambung","Ginjal"],"Paru-paru adalah organ utama tempat pertukaran oksigen dan karbon dioksida."],
["Urutan jalur udara saat menarik napas yang benar adalah ...","Hidung → faring → laring → trakea → bronkus → paru-paru",["Hidung → trakea → faring → laring → bronkus → paru-paru","Hidung → laring → faring → bronkus → trakea → paru-paru","Faring → hidung → trakea → laring → paru-paru → bronkus"],"Udara masuk lewat hidung, lalu faring, laring, trakea, bronkus, hingga paru-paru."],
["Bulu hidung dan lendir berfungsi untuk ...","menyaring debu dan kuman",["mengatur suhu tubuh","membuat suara","menyimpan oksigen"],"Bulu hidung dan lendir menyaring udara agar paru-paru terlindungi."],
["Gas yang dibutuhkan tubuh saat kita menghirup udara adalah ...","oksigen",["karbon dioksida","nitrogen","hidrogen"],"Oksigen dibutuhkan sel tubuh untuk menghasilkan energi."],
["Gas sisa yang dikeluarkan saat embusan napas adalah ...","karbon dioksida",["oksigen","helium","metana"],"Karbon dioksida adalah sisa pembakaran zat makanan di dalam sel."],
["Pertukaran oksigen dan karbon dioksida terjadi di ...","alveolus",["trakea","faring","laring"],"Alveolus adalah kantong udara kecil berdinding tipis dikelilingi pembuluh darah."],
["Otot yang berperan penting dalam pernapasan dan terletak di bawah paru-paru adalah ...","diafragma",["bisep","trisep","otot jantung"],"Diafragma bergerak naik turun untuk membantu menarik dan mengembuskan napas."],
["Saat kita menarik napas, yang terjadi adalah ...","diafragma mendatar dan rongga dada membesar",["diafragma melengkung dan rongga dada mengecil","tulang rusuk turun dan rongga dada mengecil","paru-paru mengecil"],"Rongga dada membesar sehingga udara masuk ke paru-paru."],
["Kebiasaan yang baik untuk menjaga kesehatan paru-paru adalah ...","tidak merokok dan rajin berolahraga",["sering menahan napas","tinggal di ruangan berasap","jarang membuka jendela"],"Hindari asap rokok dan polusi, serta olahraga teratur agar paru-paru sehat."],
["Penyakit paru-paru akibat bakteri yang menular lewat percikan batuk disebut ...","TBC (tuberkulosis)",["diabetes","sakit gigi","anemia"],"TBC disebabkan bakteri Mycobacterium tuberculosis dan menular lewat udara."]
];
var S,i,sk,hs,lock;
function $(x){return document.getElementById(x)}
function sh(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function mulai(){
 if(!$("nm").value.trim()||!$("kl").value.trim()){$("er").textContent="Isi nama dan kelas dulu ya!";return}
 $("s1").classList.add("hide");$("s2").classList.remove("hide");i=0;sk=0;hs=[];tampil()}
function tampil(){
 var d=Q[i];lock=false;$("no").textContent="Soal "+(i+1)+" / "+Q.length;$("pt").textContent="⭐ "+sk;
 $("pb").style.width=(i/Q.length*100)+"%";$("q").textContent=d[0];$("fb").classList.add("hide");$("nx").classList.add("hide");
 var o=sh([d[1]].concat(d[2]));$("op").innerHTML="";
 o.forEach(function(t){var b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=function(){jawab(b,t)};$("op").appendChild(b)})}
function jawab(b,t){
 if(lock)return;lock=true;var d=Q[i],ok=t===d[1];
 if(ok){sk+=10;b.classList.add("ok")}else b.classList.add("no");
 [].forEach.call($("op").children,function(x){if(x.textContent===d[1])x.classList.add("ok")});
 hs.push({q:d[0],a:t,b:d[1],ok:ok});$("pt").textContent="⭐ "+sk;
 $("fb").innerHTML=(ok?"✅ <b>Benar!</b> ":"❌ <b>Belum tepat.</b> ")+d[3];$("fb").classList.remove("hide");
 $("nx").textContent=i==Q.length-1?"Lihat Laporan 📋":"Lanjut ➜";$("nx").classList.remove("hide")}
function lanjut(){i++;if(i<Q.length)tampil();else laporan()}
function pred(n){return n>=90?["Sangat Baik 🌟","Hebat! Pemahamanmu sangat bagus."]:n>=75?["Baik 👍","Bagus! Terus pertahankan belajarmu."]:n>=60?["Cukup 🙂","Ayo pelajari lagi bagian yang masih salah."]:["Perlu Bimbingan 📚","Jangan menyerah, baca materi lagi bersama gurumu."]}
function laporan(){
 $("s2").classList.add("hide");$("s3").classList.remove("hide");
 $("rn").textContent=$("nm").value.trim();$("rk").textContent=$("kl").value.trim();
 $("rt").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 var p=pred(sk),b=hs.filter(function(h){return h.ok}).length;
 $("rs").textContent=sk;$("rp").textContent="Predikat: "+p[0];$("rb").textContent=b+" benar, "+(hs.length-b)+" salah. "+p[1];
 $("rd").innerHTML=hs.map(function(h,n){return"<tr><td>"+(n+1)+"</td><td></td><td></td><td class='"+(h.ok?"ok-t":"no-t")+"'>"+(h.ok?"✔ Benar":"✘ Salah")+"</td></tr>"}).join("");
 [].forEach.call($("rd").children,function(r,n){r.children[1].textContent=hs[n].q;r.children[2].textContent=hs[n].a+(hs[n].ok?"":" (Kunci: "+hs[n].b+")")})}
function salin(){
 var t="LAPORAN HASIL TUGAS IPAS - Sistem Pernapasan\nSDN Tayur\nNama: "+$("rn").textContent+"\nKelas: "+$("rk").textContent+"\nTanggal: "+$("rt").textContent+"\nNilai: "+sk+" ("+pred(sk)[0]+")\nBenar: "+hs.filter(function(h){return h.ok}).length+" dari "+hs.length;
 function done(m){$("cp").textContent=m}
 try{navigator.clipboard.writeText(t).then(function(){done("Laporan disalin! Kirim ke gurumu lewat WhatsApp.")},function(){done("Gagal menyalin. Gunakan tombol Cetak.")})}catch(e){done("Gagal menyalin. Gunakan tombol Cetak.")}}
</script></body></html>
